<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배경 채도 — 🎨 팔레트</title>
<style>
  :root {
    --ground: #e9ebee;
    --ink: #14161a;
    --muted: #6b7078;
    --line: #ccd0d6;
    --live: #1b3fa0;
    /* 이 요소가 조절하는 값 */
    --sat: 1.6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 80px;
    background: var(--ground); color: var(--ink);
    font: 400 16px/1.6 -apple-system, "Apple SD Gothic Neo", "Pretendard",
          "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; }
  .back { color: var(--muted); text-decoration: none; font-size: .875rem; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 1.5rem 0 .3rem; }
  .lede { color: var(--muted); margin: 0 0 2rem; }

  /* --- 무대: 홈 화면 근사 --- */
  .stage {
    width: 100%; max-width: 260px; aspect-ratio: 9 / 19.5;
    margin: 0 auto; padding: 14px 12px;
    border-radius: 14px; overflow: hidden;
    background: #6f8ff5;
    filter: saturate(var(--sat));
    transition: filter .35s ease;
    display: flex; flex-direction: column; gap: 10px;
  }
  .widgets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .widget { border-radius: 10px; background: #22304f; height: 62px; }
  .widget.pale { background: rgba(255,255,255,.55); height: 28px; }
  .widget.pale + .widget.pale { height: 30px; }
  .col { display: flex; flex-direction: column; gap: 8px; }
  .icons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; margin-top: 6px; }
  .icon { aspect-ratio: 1; border-radius: 12px; background: #fff; }
  .icon:nth-child(2) { background: #5865f2; }
  .icon:nth-child(3) { background: #fae100; }
  .icon:nth-child(5) { background: #7b2ff7; }
  .icon:nth-child(7) { background: #21b573; }
  .dock { margin-top: auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .dock div { aspect-ratio: 1; border-radius: 50%; background: #fff; }

  /* --- 조작부 --- */
  .controls { margin-top: 2rem; }
  .row { display: flex; align-items: center; gap: .75rem; padding: .8rem 0; border-bottom: 1px solid var(--line); }
  .row label { flex: 1; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: var(--live);
    border: 0; border-radius: 4px; padding: .5rem 1rem; cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--ink); }
  input[type="range"] { flex: 1; accent-color: var(--live); }
  .value { color: var(--muted); font-size: .875rem; min-width: 2.5rem; text-align: right; }
  .note { margin-top: 2rem; color: var(--muted); font-size: .9375rem; }
  @media (prefers-reduced-motion: reduce) { .stage { transition: none; } }
</style>
</head>
<body>
<main>
  <a class="back" href="../../">← 팔레트</a>
  <h1>배경 채도</h1>
  <p class="lede">껐을 때 남는 것과 켰을 때 남는 것.</p>

  <div class="stage" id="stage">
    <div class="widgets">
      <div class="widget"></div>
      <div class="col"><div class="widget pale"></div><div class="widget pale"></div></div>
    </div>
    <div class="icons">
      <div class="icon"></div><div class="icon"></div><div class="icon"></div><div class="icon"></div>
      <div class="icon"></div><div class="icon"></div><div class="icon"></div><div class="icon"></div>
    </div>
    <div class="dock"><div></div><div></div><div></div><div></div></div>
  </div>

  <div class="controls">
    <div class="row">
      <label for="sat">채도</label>
      <input id="sat" type="range" min="0" max="2" step="0.05" value="1.6">
      <span class="value" id="out">1.60</span>
    </div>
    <div class="row">
      <label>중립값(0.15)으로 되돌리기</label>
      <button id="toggle" aria-pressed="false">빼기</button>
    </div>
  </div>

  <p class="note">감산은 제거가 아니라 중립값으로 되돌리기다. 이 요소의 중립값은 0.15,
    관찰된 값은 1.60. 두 상태 사이에서 무엇이 죽는지 본다.</p>
</main>

<script>
  const NEUTRAL = 0.15, OBSERVED = 1.6;
  const stage = document.getElementById("stage");
  const slider = document.getElementById("sat");
  const out = document.getElementById("out");
  const toggle = document.getElementById("toggle");

  function set(v) {
    stage.style.setProperty("--sat", v);
    slider.value = v;
    out.textContent = Number(v).toFixed(2);
    const off = Math.abs(v - NEUTRAL) < 0.001;
    toggle.setAttribute("aria-pressed", String(off));
    toggle.textContent = off ? "되돌리기" : "빼기";
  }

  slider.addEventListener("input", (e) => set(e.target.value));
  toggle.addEventListener("click", () => {
    set(toggle.getAttribute("aria-pressed") === "true" ? OBSERVED : NEUTRAL);
  });
  set(OBSERVED);
</script>
</body>
</html>
